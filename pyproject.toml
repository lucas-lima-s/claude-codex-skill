[project]
name = "claude-codex-skill"
version = "0.4.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Scripts intentionally manipulate sys.path before importing their sibling
# `codex_config` module so they can be invoked directly without an installed
# package. E402 (module-level import not at top of file) does not apply.
[tool.ruff.lint.per-file-ignores]
"scripts/codex_batch.py" = ["E402"]
"scripts/codex_bg.py" = ["E402"]
"scripts/codex_dialogue.py" = ["E402"]
"scripts/invoke_codex_with_claude.py" = ["E402"]

[tool.black]
line-length = 120
target-version = ["py310"]
